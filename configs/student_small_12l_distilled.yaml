# BanglaBERT-Small-12L: Full 12-Layer Compact Student (13.73M params) + KD (Pareto Upper-Bound Student)
model:
  student_model_name: "BanglaBERT-Small-12L"
  init_type: "small_pretrained"
  pretrained_small_name: "csebuetnlp/banglabert_small"
  layer_selection: "strided"
  num_hidden_layers: 12
  hidden_size: 256
  num_attention_heads: 4
  intermediate_size: 1024
  max_seq_len: 64
  dropout: 0.1

distillation:
  temperature: 4.0
  alpha: 0.5
  intermediate_layers: false
  hidden_loss_weight: 0.0
  attention_loss_weight: 0.0

training:
  output_dir:             "experiments"
  run_name:               "student_small_12l_distilled"
  epochs:                 10
  batch_size:             32
  lr:                     4.0e-5
  lr_scheduler_type:      "cosine"
  weight_decay:           0.01
  warmup_ratio:           0.1
  gradient_clip:          1.0
  eval_strategy:          "epoch"
  save_strategy:          "epoch"
  early_stopping_patience: 3
  load_best_model_at_end: true
  metric_for_best:        "f1_macro"
  greater_is_better:      true
  fp16:                   true
  dataloader_num_workers: 0
