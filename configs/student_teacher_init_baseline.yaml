# Student 3: Teacher-Projected Init + Supervised Baseline (Cross-Entropy only)
model:
  student_model_name: "TinyBanglaBERT"
  init_type: "teacher_init"
  layer_selection: "strided"
  num_hidden_layers: 4
  hidden_size: 256
  num_attention_heads: 4
  intermediate_size: 1024
  max_seq_len: 64
  dropout: 0.1

training:
  output_dir:             "experiments"
  run_name:               "student_teacher_init_baseline"
  epochs:                 20
  batch_size:             32
  lr:                     2.0e-4
  lr_scheduler_type:      "cosine"
  weight_decay:           0.01
  warmup_ratio:           0.1
  gradient_clip:          1.0
  eval_strategy:          "epoch"
  save_strategy:          "epoch"
  early_stopping_patience: 4
  load_best_model_at_end: true
  metric_for_best:        "f1_macro"
  greater_is_better:      true
  fp16:                   true
  dataloader_num_workers: 0
