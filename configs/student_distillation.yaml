# Student (TinyBanglaBERT) distillation config.
# Merged on top of configs/base.yaml.

model:
  student_model_name: "csebuetnlp/banglabert_small"
  max_seq_len: 128
  dropout: 0.1

training:
  run_name:    "student_distillation"
  epochs:      5
  batch_size:  32
  lr:          3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16:        false

distillation:
  temperature: 4.0
  alpha: 0.7
  intermediate_layers: true
  hidden_loss_weight: 0.1
