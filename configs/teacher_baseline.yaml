# Teacher (BanglaBERT) baseline fine-tuning config.
# Merged on top of configs/base.yaml.

model:
  teacher_model_name: "csebuetnlp/banglabert"
  max_seq_len: 64
  dropout: 0.15

training:
  output_dir:             "experiments"
  run_name:               "teacher"
  epochs:                 5
  batch_size:             32
  lr:                     2.0e-5
  lr_scheduler_type:      "cosine"
  weight_decay:           0.05
  label_smoothing:        0.05
  warmup_ratio:           0.1
  gradient_clip:          1.0
  eval_strategy:          "epoch"
  save_strategy:          "epoch"
  early_stopping_patience: 3
  load_best_model_at_end: true
  metric_for_best:        "f1_macro"
  greater_is_better:      true
  fp16:                   true
  dataloader_num_workers: 0
