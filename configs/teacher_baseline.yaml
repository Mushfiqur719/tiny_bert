# Teacher (BanglaBERT) baseline fine-tuning config.
# Merged on top of configs/base.yaml.
defaults:
  - base                             # OmegaConf convention; loader handles merge

model:
  teacher_model_name: "csebuetnlp/banglabert"
  max_seq_len: 128
  dropout: 0.1

training:
  run_name:    "teacher_baseline"
  epochs:      5
  batch_size:  16                    # reduce if OOM on small GPU
  lr:          2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16:        false
